<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MABS Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .last-updated {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.7;
            letter-spacing: 1px;
        }
        
        .section {
            margin-bottom: 24px;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        
        .section h2 {
            margin-bottom: 16px;
            font-size: 20px;
            color: #667eea;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .alert-critical {
            background: #ff4444;
            color: white;
        }
        
        .alert-warning {
            background: #ffaa00;
            color: #000;
        }
        
        .alert-info {
            background: #4444ff;
            color: white;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .agent-card {
            background: #222;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .agent-id {
            font-weight: bold;
            font-size: 18px;
            color: #667eea;
        }
        
        .agent-status {
            font-size: 20px;
        }
        
        .agent-name {
            font-size: 13px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .agent-load {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .load-critical { background: #ff4444; color: white; }
        .load-high { background: #ffaa00; color: #000; }
        .load-medium { background: #4444ff; color: white; }
        .load-low { background: #44ff44; color: #000; }
        
        .business-card {
            background: #222;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #444;
        }
        
        .business-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .business-header h3 {
            font-size: 16px;
            color: #e0e0e0;
        }
        
        .business-status {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 4px;
            background: #333;
        }
        
        .business-details {
            font-size: 13px;
            opacity: 0.8;
        }
        
        .business-details div {
            margin-bottom: 4px;
        }
        
        .awaiting-list {
            list-style: none;
            padding: 0;
        }
        
        .awaiting-list li {
            padding: 12px;
            background: #222;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #ffaa00;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <div class="header">
            <h1>MABS Dashboard</h1>
            <p class="last-updated">Loading...</p>
        </div>
        <div class="section">
            <p style="text-align: center;">Loading dashboard data...</p>
        </div>
    </div>
    
    <script src="dashboard.js?v=2"></script>
</body>
</html>
